# All config + secrets come from .env (gitignored). Compose auto-reads .env for
# ${VAR} interpolation, and the app services read it via env_file. Nothing
# sensitive is hardcoded here. See .env.example for the full list.
#
# Internal services (postgres/redis) are NOT published to the host — the app
# reaches them over the compose network. Only the API port is exposed.
# Vector search lives inside Postgres via the pgvector extension (no separate DB).

x-app-env: &app-env
  env_file:
    - path: .env
      required: false   # falls back to pydantic defaults if absent

services:
  api:
    <<: *app-env
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
      - ./src:/app/src  # live-reload in dev
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      uv run uvicorn llm_wiki.main:app
      --host 0.0.0.0 --port 8000
      --reload
    restart: unless-stopped

  # Two dedicated workers so file ingestion can never block artifact
  # generation (they used to share one queue with concurrency=1 — one big PDF
  # froze every «Сгенерировать» button in the product).
  worker:
    <<: *app-env
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - app_data:/app/data
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      uv run celery -A llm_wiki.orchestrator.tasks.celery_app worker
      --loglevel=info
      -Q ingest
      --concurrency=${WORKER_INGEST_CONCURRENCY:-2}
      -n ingest@%h
    restart: unless-stopped

  worker-artifacts:
    <<: *app-env
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - app_data:/app/data
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      uv run celery -A llm_wiki.orchestrator.tasks.celery_app worker
      --loglevel=info
      -Q artifacts,light
      --concurrency=${WORKER_ARTIFACTS_CONCURRENCY:-3}
      -n artifacts@%h
    restart: unless-stopped

  beat:
    <<: *app-env
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - app_data:/app/data
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      uv run celery -A llm_wiki.orchestrator.tasks.celery_app beat
      --loglevel=info
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16   # Postgres 16 + pgvector extension (vector search)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmwiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-llmwiki}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmwiki} -d ${POSTGRES_DB:-llmwiki}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  app_data:
  pg_data:
