# All config + secrets come from .env (gitignored). Compose auto-reads .env for
# ${VAR} interpolation, and the app services read it via env_file. Nothing
# sensitive is hardcoded here. See .env.example for the full list.
#
# Internal services (postgres/redis/chroma) are NOT published to the host — the
# app reaches them over the compose network. Only the API port is exposed.

x-app-env: &app-env
  env_file:
    - path: .env
      required: false   # falls back to pydantic defaults if absent

services:
  api:
    <<: *app-env
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
      - ./src:/app/src  # live-reload in dev
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    command: >
      uv run uvicorn llm_wiki.main:app
      --host 0.0.0.0 --port 8000
      --reload
    restart: unless-stopped

  worker:
    <<: *app-env
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - app_data:/app/data
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    command: >
      uv run celery -A llm_wiki.orchestrator.tasks.celery_app worker
      --loglevel=info
      --concurrency=1
    restart: unless-stopped

  beat:
    <<: *app-env
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - app_data:/app/data
      - ./src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    command: >
      uv run celery -A llm_wiki.orchestrator.tasks.celery_app beat
      --loglevel=info
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmwiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-llmwiki}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llmwiki} -d ${POSTGRES_DB:-llmwiki}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped

volumes:
  redis_data:
  app_data:
  pg_data:
  chroma_data:
