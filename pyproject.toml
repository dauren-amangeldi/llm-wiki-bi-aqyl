[project]
name = "llm-wiki"
version = "0.1.0"
description = "LLM-powered wiki ingestion system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.35.0",
    "anthropic>=0.30.0",
    "pgvector>=0.3.0",              # vector search inside PostgreSQL (replaces ChromaDB)
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",       # PostgreSQL driver (async app engine + sync vector engine)
    "minio>=7.2.0",                 # S3-compatible object storage (raw + wiki)
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.0.0",            # render scanned-PDF pages to images for OCR
    "python-docx>=1.1.0",          # extract text from Word (.docx) uploads
    "markdown-it-py>=3.0.0",
    "structlog>=24.2.0",
    "python-multipart>=0.0.9",
    "filelock>=3.15.0",
    "uuid6>=2022.10.25",
    "python-slugify>=8.0.0",
    "pyjwt[crypto]>=2.9.0",         # verify Keycloak access tokens via JWKS
    "httpx>=0.27.0",               # OIDC code->token exchange (Keycloak)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "vcrpy>=6.0.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "fpdf2>=2.7.0",   # generates sample.pdf fixture for parser tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wiki"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",    # pycodestyle + pyflakes
    "I",               # isort
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "C4",              # flake8-comprehensions
    "SIM",             # flake8-simplify
    "RUF",             # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["llm_wiki"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "pdfplumber.*",
    "pypdf.*",
    "pypdfium2.*",
    "pgvector.*",
    "vcr.*",
    "celery.*",
    "markdown_it.*",
    "slugify.*",
    "uuid6.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/llm_wiki --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/llm_wiki"]
omit = ["src/llm_wiki/llm/prompts/*"]
